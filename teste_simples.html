<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Muito Simples</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; }
        .result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; }
        .error { background-color: #f8d7da; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        input { width: 100%; padding: 10px; margin: 5px 0; }
    </style>
</head>
<body>
    <h1>🔐 Teste Muito Simples</h1>
    
    <div>
        <h3>1. Testar Conexão</h3>
        <button onclick="testConnection()">Testar Conexão</button>
        <div id="connectionResult"></div>
    </div>

    <div>
        <h3>2. Gerar Token</h3>
        <input type="email" id="email" placeholder="E-mail" value="admin@dorowcamp.com" />
        <button onclick="generateToken()">Gerar Token</button>
        <div id="tokenResult"></div>
    </div>

    <div>
        <h3>3. Testar Reset</h3>
        <input type="text" id="token" placeholder="Token" />
        <input type="password" id="password" placeholder="Nova senha" value="NovaSenha123!" />
        <button onclick="testReset()">Testar Reset</button>
        <div id="resetResult"></div>
    </div>

    <script>
        const BASE_URL = 'http://localhost:5144';

        async function testConnection() {
            const resultDiv = document.getElementById('connectionResult');
            resultDiv.innerHTML = 'Testando conexão...';
            
            try {
                const response = await fetch(`${BASE_URL}/Login/TestForgotPassword`);
                const result = await response.json();
                
                if (result.success) {
                    resultDiv.innerHTML = `<div class="success">✅ Conexão OK! ${result.message}</div>`;
                } else {
                    resultDiv.innerHTML = `<div class="error">❌ Erro: ${result.message}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ Erro de conexão: ${error.message}</div>`;
            }
        }

        async function generateToken() {
            const email = document.getElementById('email').value;
            const resultDiv = document.getElementById('tokenResult');
            
            if (!email) {
                resultDiv.innerHTML = '<div class="error">Digite um e-mail</div>';
                return;
            }
            
            resultDiv.innerHTML = 'Gerando token...';
            
            try {
                const response = await fetch(`${BASE_URL}/Login/ForgotPassword`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    resultDiv.innerHTML = `<div class="success">✅ ${result.message}</div>`;
                } else {
                    resultDiv.innerHTML = `<div class="error">❌ ${result.message}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ Erro: ${error.message}</div>`;
            }
        }

        async function testReset() {
            const token = document.getElementById('token').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('resetResult');
            
            if (!token || !password) {
                resultDiv.innerHTML = '<div class="error">Preencha token e senha</div>';
                return;
            }
            
            resultDiv.innerHTML = 'Testando reset...';
            
            try {
                const response = await fetch(`${BASE_URL}/Login/ResetPassword`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token: token,
                        newPassword: password,
                        confirmPassword: password
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    resultDiv.innerHTML = `<div class="success">✅ ${result.message}</div>`;
                } else {
                    resultDiv.innerHTML = `<div class="error">❌ ${result.message}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ Erro: ${error.message}</div>`;
            }
        }

        // Testar conexão automaticamente ao carregar
        window.onload = function() {
            testConnection();
        };
    </script>
</body>
</html>
